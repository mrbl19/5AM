<!-- image rotation -->
<script>
    var imageList = [
        { src: 'images/cheese_milk.jpg',    alt: 'Cheese milk' },
        { src: 'images/cinnamon_milk.jpg',  alt: 'Cinnamon milk' },
    ];
    var currentIndex = 0;
    var imgEls = document.querySelectorAll('.image-row img');

    setInterval(function() {
        imgEls.forEach(function(img) { img.style.opacity = '0'; });
        setTimeout(function() {
            currentIndex = (currentIndex + 1) % imageList.length;
            imgEls.forEach(function(img, slot) {
                var item = imageList[(currentIndex + slot) % imageList.length];
                img.src = item.src;
                img.alt = item.alt;
            });
            imgEls.forEach(function(img) { img.style.opacity = '1'; });
        }, 800);
    }, 3500);
</script>
